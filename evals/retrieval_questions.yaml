# Retrieval eval set (Phase 1). Grows in Phase 2 and Phase 7.
#
# For each question we know which course, module and topic contains the answer.
# The eval checks whether retrieval puts a chunk of that topic in the top k results.
# It does NOT call the chat model, so a full run costs only ~22 tiny embedding calls.
#
#   uv run python -m app.evals.retrieval          (from backend/)
#
# Note how questions are phrased like a student would ask, not copied from the text:
# a good eval tests meaning, not keyword overlap.

questions:
  - id: R01
    question: "What's the difference between a list and a tuple in Python?"
    course: PY101
    module: 2
    topic: Lists and Tuples
  - id: R02
    question: "Why is looking up a key in a dictionary so fast?"
    course: PY101
    module: 2
    topic: Dictionaries and Sets
