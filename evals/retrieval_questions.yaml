# Retrieval eval set. Phase 1: 20 + 2. Phase 2: 48 (grows again in Phase 7).
#
# For each question we know which course, module and topic contains the answer.
# The eval checks whether retrieval puts a chunk of that topic in the top k results.
#
#   uv run python -m app.evals.retrieval              (from backend/)  current .env settings
#   uv run python -m app.evals.retrieval --compare    every Phase 2 step on/off, side by side
#
# Categories (each tests a different weakness):
#   semantic    phrased like a student, not copied from the notes        (Phase 1 set)
#   keyword     exact terms: code, acronyms, error names                 -> hybrid search helps
#   paraphrase  describes the concept without naming it                  -> reranking / corrective retry help
#   follow_up   only makes sense with the previous question (`history`)  -> query rewriting helps
#   no_answer   not in any course: nothing may count as relevant
#
# Cost: dense-only modes call only the embeddings API (~$0.00001). Modes with rewriting
# also make a few tiny chat calls (follow-ups + corrective retries), ~$0.001 in total.

questions:
