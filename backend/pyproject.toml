[project]
name = "lms-genai-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "faker>=40.40.0",
    "fastapi>=0.142.2",
    "langchain>=1.4.3",
    "langchain-core>=1.6.6",
    "langchain-openai>=1.6.7",
    "langfuse>=4.16.0",
    "langgraph>=1.2.12",
    "neo4j>=6.3.1",
    "openai>=3.24.0",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.19.1",
    "sqlalchemy[asyncio]>=2.1.3",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is idiomatic
