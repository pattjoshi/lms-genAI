# Runs on every pull request and on pushes to development: backend lint + tests against real databases,
# and a frontend type check + production build.
name: CI

on:
  pull_request:
  push:
    branches: [development]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash # -eo pipefail: a failing command in a pipe fails the step

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    # The same images and passwords as docker-compose.yml, on the ports the backend's defaults expect.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: lms_dev_password
          POSTGRES_DB: lms
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U lms -d lms" --health-interval 5s --health-timeout 3s --health-retries 20
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports: ["6333:6333"]
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/lms_neo4j_password
        ports: ["7474:7474", "7687:7687"]
    env:
      APP_ENV: test
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Cache the reranker model
        uses: actions/cache@v4
        with:
          path: backend/storage/models
          key: reranker-${{ hashFiles('backend/app/config.py') }}
      - name: Wait for Qdrant and Neo4j
        run: |
          for url in http://localhost:6333/readyz http://localhost:7474; do
            for i in $(seq 1 60); do curl -sf "$url" > /dev/null && break; sleep 2; done
            curl -sf "$url" > /dev/null || { echo "$url did not come up"; exit 1; }
          done
      - name: Test
        # Tests that need a database skip themselves when it's down. In CI every database is up,
        # so a skipped test means something is wrong: fail instead of passing quietly.
        run: |
          uv run pytest -q -rs | tee pytest.log
          if grep -q "SKIPPED" pytest.log; then echo "::error::Tests were skipped in CI"; exit 1; fi

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
